<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20252b"><title>Smoking Grillers Sound Player</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head>
<body>
<header><button id="homeButton" class="icon-button" aria-label="Home">⌂</button><div><strong>Smoking Grillers</strong><small id="status">Not connected</small></div><button id="connect" class="connect">Connect</button></header>
<main>
<section class="view active" data-view="home"><img src="assets/sg.jpg" class="hero" alt="Smoking Grillers"><div class="menu"><button data-go="smoking">Smokin’ Grillers</button><button data-go="homer">Homer</button><button data-go="spooky">Spooky</button><button data-go="settings">Settings &amp; Wi-Fi</button></div></section>
<section class="view" data-view="smoking"><h1>Smokin’ Grillers</h1><img src="assets/sg.jpg" class="hero" alt="Smoking Grillers"><div class="sound-grid"><button data-sound="1">ROAR</button><button data-sound="2">SNORTS</button><button data-sound="3">WO-AAAR</button><button data-sound="4">LOW GROWL</button><button data-sound="5">W-ROAR</button><button data-sound="6">SNARL</button></div></section>
<section class="view" data-view="homer"><h1>Homer</h1><img src="assets/homer-car.jpg" class="hero" alt="Homer's car"><div class="sound-grid"><button data-sound="10">D’OH</button><button data-sound="11">BEER</button><button data-sound="12">BORING</button><button data-sound="13">ALCOHOL</button><button data-sound="14">CRAP</button><button data-sound="15">BOOBIES</button><button data-sound="16">FISHING</button><button data-sound="17">WHEN I WAS 17</button><button data-sound="18">CHAMPIONS</button><button data-sound="19">YOU MANIACS</button></div><p class="note">Note: sound 10.wav was not present in the supplied project.</p></section>
<section class="view" data-view="spooky"><h1>Spooky</h1><img src="assets/spooky.jpg" class="hero" alt="Spooky skeleton"><div class="sound-grid"><button data-sound="20">DEAD BY DAWN</button><button data-sound="21">LET ME OUT!</button><button data-sound="22">HA HA HA HA</button><button data-sound="23">ARRGH</button><button data-sound="24">GROOVY</button><button data-sound="25">LIGHTEN UP</button><button data-sound="26">NO YOU IDIOT</button><button data-sound="27">FROGHURT</button><button data-sound="28">WITCH LAUGH</button><button data-sound="29">PLAY A GAME?</button></div></section>
<section class="view" data-view="settings"><h1>Settings</h1><label>Volume <output id="volumeValue">50%</output><input id="volume" type="range" min="0" max="100" step="10" value="50"></label><label class="switch"><input id="pir" type="checkbox"> Enable PIR trigger</label><h2>Wi-Fi setup</h2><button id="scan">Scan for Wi-Fi networks</button><label>Network<select id="ssid"><option value="">Select a network</option></select></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="join" class="primary">Save and connect</button><p id="wifiResult"></p></section>
</main><nav aria-label="Sound categories"><button data-go="smoking">Grillers</button><button data-go="homer">Homer</button><button data-go="spooky">Spooky</button><button data-go="settings">Settings</button></nav><script src="app.js"></script></body></html>
